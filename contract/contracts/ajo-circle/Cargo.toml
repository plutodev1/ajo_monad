[package]
name = "ajo-circle"
version = "0.1.0"
edition = "2021"
publish = false
description = "AjoBook on Stellar: rotating savings (Ajo / Esusu) circles as a Soroban contract"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
