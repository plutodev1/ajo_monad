name: AjoBook on Stellar

on:
  push:
    branches: [main]
    paths: ["stellar/**", "web/src/stellar*", "web/scripts/**", ".github/workflows/stellar.yml"]
  pull_request:
    paths: ["stellar/**", "web/src/stellar*", "web/scripts/**", ".github/workflows/stellar.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar
      - run: cargo test
        working-directory: stellar
      - run: cargo build --release --target wasm32v1-none -p ajo-circle
        working-directory: stellar

  e2e:
    name: Full circle on Stellar testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run e2e
        working-directory: web
